[platformio]
src_dir = firmware/marquee

[env:nodemcuv2]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
monitor_speed = 115200
monitor_filters = esp8266_exception_decoder
board_build.filesystem = littlefs
; 160 MHz halves the TLS handshake pause during the status poll and leaves
; more time for Wi-Fi between LED frames.
board_build.f_cpu = 160000000L
build_flags =
    -D WEBSOCKETS_SERVER_CLIENT_MAX=4
lib_deps =
    adafruit/Adafruit NeoPixel@1.15.5
    bblanchon/ArduinoJson@7.4.3
    links2004/WebSockets@2.7.3

; Over-the-air: pio run -e ota -t upload
[env:ota]
extends = env:nodemcuv2
upload_protocol = espota
upload_port = marquee.local
